[package]
name = "remoter-agent"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
getrandom = "0.4.3"
libc = "0.2.189"
remoter-auth = { version = "1.1.0", path = "../remoter-auth" }
remoter-proto = { version = "1.1.0", path = "../remoter-proto" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
toml = "1.1.6"
ulid = "3.0.0"

[features]
# test knobs for the e2e suite, never in a release build
e2e-test = []

[lints]
workspace = true

[dev-dependencies]
remoter-auth = { version = "1.1.0", path = "../remoter-auth", features = ["testkit"] }
