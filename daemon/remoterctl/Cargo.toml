[package]
name = "remoterctl"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
axum = { version = "0.8.9", default-features = false }
hyper = "1.11.1"
hyper-rustls = { version = "0.27.10", default-features = false, features = ["http1", "webpki-tokio", "aws-lc-rs"] }
hyper-util = { version = "0.1.21", features = ["client-legacy", "http1", "tokio"] }
libc = "0.2.189"
qrcode = { version = "0.14.1", default-features = false }
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "aws_lc_rs"] }
remoter-agent = { version = "0.1.0", path = "../remoter-agent" }
remoter-attest = { version = "0.1.0", path = "../remoter-attest" }
remoter-auth = { version = "0.1.0", path = "../remoter-auth" }
remoter-proto = { version = "0.1.0", path = "../remoter-proto" }
remoterd = { version = "0.1.0", path = "../remoterd" }
rustls = { version = "0.23.45", default-features = false, features = ["aws_lc_rs", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["rt", "net", "io-util", "time", "macros"] }
toml = "1.1.6"
ulid = "3.0.0"
webpki-roots = "1.0.9"

[lints]
workspace = true

[dev-dependencies]
libc = "0.2.189"
remoter-auth = { version = "0.1.0", path = "../remoter-auth", features = ["testkit"] }
