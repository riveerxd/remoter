[package]
name = "remoter-e2e-host"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "Host end to end suite: real daemons in throwaway namespaces, a software phone"

# the suite builds the daemons itself, with e2e-test, into their own target
# dir, so the feature never leaks into the normal build
[dependencies]
axum = { version = "0.8.9", default-features = false }
futures-util = "0.3.34"
hyper = { version = "1.11.1", features = ["client", "http2"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
libc = "0.2.189"
p256 = { version = "0.14.0", features = ["ecdsa", "pkcs8"] }
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "aws_lc_rs"] }
remoter-attest = { version = "1.1.0-dev", path = "../remoter-attest", features = ["testkit"] }
remoter-auth = { version = "1.1.0-dev", path = "../remoter-auth", features = ["testkit"] }
remoter-proto = { version = "1.1.0-dev", path = "../remoter-proto" }
remoterctl = { version = "1.1.0-dev", path = "../remoterctl" }
rustls = { version = "0.23.45", default-features = false, features = ["aws_lc_rs", "std"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["aws_lc_rs"] }
x509-parser = "0.18.1"

[lints]
workspace = true
