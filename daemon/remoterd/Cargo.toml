[package]
name = "remoterd"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["json", "http2", "tokio", "matched-path", "original-uri"] }
base64 = "0.23.1"
futures-util = "0.3.34"
getrandom = "0.4.3"
hyper = { version = "1.11.1", features = ["server", "http2"] }
hyper-util = { version = "0.1.21", features = ["server", "http2", "tokio", "service"] }
libc = "0.2.189"
remoter-attest = { version = "1.0.0", path = "../remoter-attest" }
remoter-auth = { version = "1.0.0", path = "../remoter-auth" }
remoter-proto = { version = "1.0.0", path = "../remoter-proto" }
rustls = { version = "0.23.45", default-features = false, features = ["aws_lc_rs", "std", "prefer-post-quantum"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
socket2 = { version = "0.6.5", features = ["all"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "signal", "sync", "time", "macros", "io-util"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["aws_lc_rs"] }
toml = "1.1.6"
tracing = "0.1.44"
tracing-journald = "0.3.2"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["registry", "fmt", "std"] }
ulid = "3.0.0"
x509-parser = "0.18.1"

[features]
# test knobs for the e2e suite, never in a release build
e2e-test = []

[lints]
workspace = true

[dev-dependencies]
futures-util = "0.3.34"
hyper = { version = "1.11.1", features = ["client", "http2"] }
libc = "0.2.189"
p256 = { version = "0.14.0", features = ["ecdsa", "pkcs8"] }
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "aws_lc_rs"] }
remoter-attest = { version = "1.0.0", path = "../remoter-attest", features = ["testkit"] }
remoter-auth = { version = "1.0.0", path = "../remoter-auth", features = ["testkit"] }
rustls = { version = "0.23.45", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["aws_lc_rs"] }
x509-parser = "0.18.1"
