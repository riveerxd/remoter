# Loaded by remoter-firewall.service, never by nftables.service: that one runs
# `flush ruleset` on stop and would wipe Docker's rules.
destroy table inet remoter_raw
destroy table inet remoter_host

table inet remoter_raw {
  chain pre {
    type filter hook prerouting priority raw; policy accept;
    # Weak host model: someone on the LAN routes 10.66.66.3 at us and the
    # kernel would happily accept it on any interface.
    iifname != "rmt0" ip daddr 10.66.66.0/29 drop
    iifname != "rmt0" ip saddr 10.66.66.0/29 drop
  }
}

table inet remoter_host {
  # The phone's ports. nftables-staging.conf adds staging's two when staging
  # is installed; nothing else ever edits this table.
  set phone_ports {
    type inet_service
    elements = { 8443, 8444 }
  }
  chain input {
    # Only touches traffic from our own tunnel. LAN, other VPNs, Docker etc.
    # behave exactly as if this table wasn't there.
    type filter hook input priority 0; policy accept;
    iifname != "rmt0" accept
    ct state invalid drop
    ct state established,related accept
    # The destination too: from the tunnel, only the tunnel address answers,
    # never the same port on another of the laptop's addresses.
    ip saddr 10.66.66.2 ip daddr 10.66.66.3 tcp dport @phone_ports accept
    ip saddr 10.66.66.2 ip daddr 10.66.66.3 icmp type echo-request accept
    drop
  }
  chain forward {
    # Docker turns ip_forward on, so without this a compromised VPS could
    # route through rmt0 into containers or the LAN.
    type filter hook forward priority -10; policy accept;
    iifname "rmt0" drop
    oifname "rmt0" drop
  }
}
